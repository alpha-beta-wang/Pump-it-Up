[project]
name = "pump-it-up"
version = "0.1.0"
description = "DrivenData Pump it Up: predict the operating condition of water points in Tanzania"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"
authors = [{ name = "Pump-it-Up Team" }]
keywords = ["drivendata", "tabular", "multiclass-classification", "water-points"]

dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "scipy>=1.14",
    "scikit-learn>=1.5",
    "lightgbm>=4.5",
    "xgboost>=2.1",
    "catboost>=1.2",
    "matplotlib>=3.9",
    "seaborn>=0.13",
]

[dependency-groups]
dev = [
    "jupyterlab>=4.2",
    "ipykernel>=6.29",
    "ruff>=0.7",
]

[tool.uv]
# 本项目不是要发布的包，只借用 pyproject 声明环境
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
